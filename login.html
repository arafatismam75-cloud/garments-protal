<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garments Enterprise - Login</title>
    <style>
        :root {
            --border-color: #cbd5e1;
        }
        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
            color: #1e293b;
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        .login-logo { font-size: 50px; margin-bottom: 10px; }
        .login-card h2 { margin: 0 0 5px 0; color: #0f172a; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
        .login-card p { color: #64748b; font-size: 14px; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 12px; font-weight: bold; color: #475569; margin-bottom: 5px; text-transform: uppercase; }
        .login-input {
            width: 100%; padding: 12px 15px; border: 1px solid var(--border-color);
            border-radius: 8px; font-size: 15px; box-sizing: border-box;
            background-color: #f8fafc; transition: 0.3s;
        }
        .login-input:focus { border-color: #0284c7; background-color: #fff; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); outline: none; }
        .btn-login {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: white;
            border: none; padding: 14px; width: 100%; border-radius: 8px;
            cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); transition: 0.3s;
        }
        .btn-login:hover { transform: translateY(-1px); box-shadow: 0 6px 15px rgba(2, 132, 199, 0.4); }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-logo">💼</div>
    <h2>Garments Enterprise Portal</h2>
    <p>Please enter your login username and password</p>
    
    <div class="input-group">
        <label>Username</label>
        <input type="text" id="userInput" class="login-input" placeholder="--Select Username--">
    </div>
    
    <div class="input-group">
        <label>Password</label>
        <input type="password" id="passInput" class="login-input" placeholder="••••••••">
    </div>
    
    <button class="btn-login" onclick="checkPassword()">Sign In</button>
</div>

<script>
    const correctUser = "arafat";
    const correctPassword = "Arafat123";

    function checkPassword() {
        const userInput = document.getElementById('userInput').value.trim().toLowerCase();
        const passInput = document.getElementById('passInput').value;
        
        if(userInput === correctUser && passInput === correctPassword) {
            sessionStorage.setItem('isUnlocked', 'true');
            window.location.href = "index.html"; // সফল লগইন হলে ডাটা এন্ট্রি পেজে নিয়ে যাবে
        } else {
            alert("Invalid username or password! Please try again.");
        }
    }
</script>
</body>
</html>
