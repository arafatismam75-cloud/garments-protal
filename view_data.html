<!DOCTYPE html>
<html lang="en">
<head>
<script>
    // পেজ পুরোপুরি রেডি হওয়ার পর সিকিউরিটি চেক রান হবে
    window.addEventListener('DOMContentLoaded', () => {
        if (sessionStorage.getItem('isUnlocked') !== 'true') {
            alert("Access Denied! Please login first."); // ইউজারকে অ্যালার্ট দেবে
            window.location.replace("login.html"); // রিডাইরেক্ট হিস্ট্রি ক্লিন রাখবে
        }
    });
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Entered Data</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --accent-color: #38bdf8;
            --bg-color: #f1f5f9;
            --sidebar-bg: #0f172a;
            --sidebar-text: #94a3b8;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --search-bg: linear-gradient(90deg, #f0f9ff 0%, #f0fdf4 100%);
            --ratio-bg: #f8fafc;
            --qty-bg: #eff6ff;
        }

        /* Professional Login Screen Design */
        #lockScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
            color: #1e293b;
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        .login-logo {
            font-size: 50px;
            margin-bottom: 10px;
        }
        .login-card h2 {
            margin: 0 0 5px 0;
            color: #0f172a;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .login-card p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .login-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #f8fafc;
            transition: 0.3s;
        }
        .login-input:focus {
            border-color: #0284c7;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
            outline: none;
        }
        .btn-login {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            transition: 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(2, 132, 199, 0.4);
        }

        /* Dashboard & Sidebar */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            color: var(--text-color);
        }

        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            height: 100vh;
            position: fixed;
            top: 0; left: 0;
            padding: 25px 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 4px 0 15px rgba(0,0,0,0.05);
        }

        .sidebar h3 {
            margin-top: 0;
            text-align: center;
            font-size: 18px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            color: #fff;
        }

        .sidebar-link {
            color: #94a3b8;
            padding: 12px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .sidebar-link:hover, .sidebar-link.active {
            background: rgba(255,255,255,0.05);
            color: #fff;
        }
        .sidebar-link.active {
            border-left: 4px solid var(--accent-color);
            background: rgba(56, 189, 248, 0.1);
        }

        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 20px 30px 40px 30px;
            box-sizing: border-box;
        }

        /* Top Header Profile */
        .top-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px 0;
            margin-bottom: 25px;
            border-bottom: 1px solid #cbd5e1;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 14px;
            background: #ffffff;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            cursor: pointer;
            transition: 0.2s;
        }

        .user-profile:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .profile-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: white;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.2);
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .profile-name {
            color: #0f172a;
            font-weight: 700;
            font-size: 13px;
            line-height: 1.2;
        }

        .profile-role {
            color: #64748b;
            font-size: 10px;
            margin-top: 1px;
        }

        /* Table Area */
        .container {
            max-width: 1450px;
            margin: auto;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            border: 1px solid #e2e8f0;
        }

        h2 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 5px;
            color: #0f172a;
        }
        .container p { margin-top: 0; margin-bottom: 30px; color: #64748b;}

        .control-panel {
            padding: 15px;
            background: var(--search-bg);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            border: 1px solid #e2e8f0;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 250px;
        }

        .search-input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .backup-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-backup {
            padding: 10px 15px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            transition: 0.3s;
        }

        .btn-export { background-color: #059669; }
        .btn-export:hover { background-color: #047857; }
        .btn-import { background-color: #2563eb; }
        .btn-import:hover { background-color: #1d4ed8; }

        table.result-table { width: 100%; border-collapse: collapse; }
        table.result-table th {
            background: #1e293b;
            color: white;
            padding: 10px 8px;
            font-size: 12px;
            border: 1px solid var(--border-color);
            white-space: nowrap;
        }

        table.result-table td { border: 1px solid var(--border-color); padding: 8px; text-align: center; font-size: 12px; }

        .bg-ratio { background-color: var(--ratio-bg); }
        .bg-qty { background-color: var(--qty-bg); }
        .total-cell { font-weight: bold; color: #059669; background-color: #d1fae5 !important; }

        .action-container { display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center; }

        .btn-edit {
            background-color: #e2e8f0;
            color: #0f172a;
            border: 1px solid #cbd5e1;
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 55px;
        }
        .btn-edit:hover { background-color: #cbd5e1; }

        .btn-delete { 
            background-color: #fee2e2; 
            color: #ef4444; 
            border: 1px solid #fca5a5; 
            padding: 4px 10px; 
            font-size: 11px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold;
            width: 55px;
        }
        .btn-delete:hover { background-color: #fca5a5; }
    </style>
</head>
<body>

<!-- Login Gate Screen -->
<div id="lockScreen">
    <div class="login-card">
        <div class="login-logo"></div>
        <h2>Garments Enterprise Portal</h2>
        <p>Please enter your login username and password</p>
        
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="userInput" class="login-input" placeholder="--Username--">
        </div>
        
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="passInput" class="login-input" placeholder="--Password--">
        </div>
        
        <button class="btn-login" onclick="checkPassword()">Sign In</button>
    </div>
</div>

<div class="sidebar">
    <h3>📊 ERP System</h3>
    <a href="index.html" class="sidebar-link">Data Entry Form</a>
    <a href="view_data.html" class="sidebar-link active">View Entered Data</a>
    
    <!-- Logout Button -->
    <a href="#" class="sidebar-link" onclick="logout()" style="margin-top: auto; color: #f87171; border-left: none; background: rgba(248, 113, 113, 0.05);">
        🚪 Log Out
    </a>
</div>

<div class="main-content">
    <!-- Top Header Profile -->
    <div class="top-header">
        <div class="user-profile" title="Arafat's Profile">
            <div class="profile-avatar">A</div>
            <div class="profile-info">
                <span class="profile-name">BILLAL</span>
                <span class="profile-role">🟢 Cutting In-charge</span>
            </div>
        </div>
    </div>

    <div class="container">
        <h2>Garments Smart Data Portal</h2>
        <p> Cutting Department Data Entry List</p>
        
        <div class="control-panel">
            <div class="search-box">
                <label>🔍 <strong>Style:</strong></label>
                <input type="text" id="searchStyle" class="search-input" placeholder="Search Style..." oninput="filterData()">
            </div>
            
            <div class="backup-buttons">
                <button class="btn-backup btn-export" onclick="exportToJSON()">📥 Save Backup File</button>
                <button class="btn-backup btn-import" onclick="document.getElementById('fileInput').click()">📤 Load Backup File</button>
                <input type="file" id="fileInput" style="display: none;" accept=".json" onchange="importFromJSON(event)">
            </div>
        </div>

        <div style="overflow-x: auto;">
            <table id="dataTable" class="result-table">
                <thead id="resultHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const correctUser = "arafat";
    const correctPassword = "Arafat123";

    function checkPassword() {
        const userInput = document.getElementById('userInput').value.trim().toLowerCase();
        const passInput = document.getElementById('passInput').value;
        
        if(userInput === correctUser && passInput === correctPassword) {
            sessionStorage.setItem('isUnlocked', 'true');
            document.getElementById('lockScreen').style.display = 'none';
        } else {
            alert("Invalid username or password! Please try again.");
        }
    }

    function logout() {
        if(confirm("Are you sure you want to log out?")) {
            sessionStorage.removeItem('isUnlocked');
            window.location.reload();
        }
    }

    const sizeGroups = {
        regular: ['XXS', 'XS', 'S', 'M', 'L', 'XL', 'XXL', '3XL', '4XL'],
        junior: ['128', '140', '152', '164', '176'],
        ps: ['2XL', '3XL', '4XL', '5XL', '6XL', '7XL', '8XL']
    };

    let garmentsData = JSON.parse(localStorage.getItem('garmentsData')) || [];
    localStorage.removeItem('editIndex'); 

    window.onload = function() {
        if(sessionStorage.getItem('isUnlocked') === 'true') {
            document.getElementById('lockScreen').style.display = 'none';
        }
        renderTable(garmentsData);
    }

    function renderTable(dataList) {
        const resultHead = document.getElementById('resultHead');
        const tableBody = document.getElementById('tableBody');
        
        if(dataList.length === 0) {
            resultHead.innerHTML = `<tr><th>Data Status</th></tr>`;
            tableBody.innerHTML = `<tr><td>No data found. Please enter data first or load a backup file.</td></tr>`;
            return;
        }

        const maxSizes = sizeGroups['regular'];
        let sizeHeaderCols = "";
        maxSizes.forEach(sz => { sizeHeaderCols += `<th>${sz}</th>`; });

        resultHead.innerHTML = `
            <tr>
                <th rowspan="2">Sr. No.</th><th rowspan="2">Buyer Name</th><th rowspan="2">Style</th><th rowspan="2">Color</th>
                <th rowspan="2">Date</th><th rowspan="2">Cutting No.</th><th rowspan="2">PO No.</th><th rowspan="2">Batch No.</th>
                <th rowspan="2">Shade</th><th rowspan="2">Total Lay</th><th rowspan="2">Table No.</th><th rowspan="2">M/L</th>
                <th rowspan="2">M/W</th><th rowspan="2">M/C</th><th rowspan="2">Lay Wet/C</th><th rowspan="2">M/EFC</th>
                <th rowspan="2">Category</th><th rowspan="2">Type</th>
                <th colspan="${maxSizes.length}">Size Breakup</th>
                <th rowspan="2">Total Pcs</th><th rowspan="2">Action</th>
            </tr>
            <tr>
                ${sizeHeaderCols}
            </tr>
        `;

        tableBody.innerHTML = "";
        
        dataList.forEach((row, actualIndex) => {
            let rCells = "", qCells = "";
            const currentCategory = row.category || 'regular';
            const currentSizes = sizeGroups[currentCategory];

            maxSizes.forEach((sz, i) => {
                let rVal = 0, qVal = 0;
                const sizeIndex = row.sizesArray.indexOf(sz);
                if(sizeIndex !== -1) {
                    rVal = row.rValues[sizeIndex];
                    qVal = row.qValues[sizeIndex];
                }
                rCells += `<td>${rVal}</td>`;
                qCells += `<td>${qVal}</td>`;
            });

            const ratioRow = document.createElement('tr');
            ratioRow.className = 'bg-ratio';
            ratioRow.innerHTML = `
                <td rowspan="2" style="vertical-align:middle; font-weight:bold;">${row.srNo}</td>
                <td rowspan="2" style="vertical-align:middle;">${row.buyerName}</td>
                <td rowspan="2" style="vertical-align:middle;">${row.style}</td>
                <td rowspan="2" style="vertical-align:middle;">${row.color}</td>
                <td rowspan="2" style="vertical-align:middle;">${row.date}</td>
                <td rowspan="2" style="vertical-align:middle;">${row.cuttingNo}</td>
                <td rowspan="2" style="vertical-align:middle;">${row.poNo}</td>
                <td rowspan="2" style="vertical-align:middle;">${row.batchNo}</td>
                <td rowspan="2" style="vertical-align:middle;">${row.shade || '-'}</td>
                <td rowspan="2" style="vertical-align:middle;">${row.totalLay || '-'}</td>
                <td rowspan="2" style="vertical-align:middle;">${row.tableNo || '-'}</td>
                <td rowspan="2" style="vertical-align:middle;">${row.ml || '-'}</td>
                <td rowspan="2" style="vertical-align:middle;">${row.mw || '-'}</td>
                <td rowspan="2" style="vertical-align:middle;">${row.mc || '-'}</td>
                <td rowspan="2" style="vertical-align:middle;">${row.layWetc || '-'}</td>
                <td rowspan="2" style="vertical-align:middle;">${row.mefc || '-'}</td>
                <td rowspan="2" style="vertical-align:middle; text-transform:uppercase; font-weight:700;">${row.category}</td>
                <td style="font-weight:bold; font-size:11px;">Ratio</td>
                ${rCells}
                <td style="font-weight:bold; background:rgba(0,198,255,0.1);">${row.totalRatio}</td>
                <td rowspan="2" style="vertical-align:middle;">
                    <div class="action-container">
                        <button class="btn-edit" onclick="editData(${actualIndex})">Edit</button>
                        <button class="btn-delete" onclick="deleteData(${actualIndex})">Delete</button>
                    </div>
                </td>
            `;

            const qtyRow = document.createElement('tr');
            qtyRow.className = 'bg-qty';
            qtyRow.innerHTML = `
                <td style="font-weight:bold; font-size:11px;">Qty (Pcs)</td>
                ${qCells}
                <td class="total-cell">${row.totalQty}</td>
            `;
            
            tableBody.appendChild(ratioRow);
            tableBody.appendChild(qtyRow);
        });
    }

    function editData(index) {
        localStorage.setItem('editIndex', index); 
        window.location.href = "index.html"; 
    }

    function deleteData(index) {
        if(confirm("Are you sure you want to delete this data?")) {
            garmentsData.splice(index, 1);
            localStorage.setItem('garmentsData', JSON.stringify(garmentsData));
            renderTable(garmentsData);
        }
    }

    function filterData() {
        const txt = document.getElementById('searchStyle').value.toLowerCase().trim();
        const filtered = garmentsData.filter(item => item.style.toLowerCase().includes(txt));
        renderTable(filtered);
    }

    function exportToJSON() {
        if(garmentsData.length === 0) {
            alert("No data available to download!");
            return;
        }
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(garmentsData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "Garments_Data_Backup.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function importFromJSON(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (Array.isArray(importedData)) {
                    if(confirm("Uploading this file will replace all existing data. Are you sure?")) {
                        garmentsData = importedData;
                        localStorage.setItem('garmentsData', JSON.stringify(garmentsData));
                        renderTable(garmentsData);
                        alert("Success! Your backup data has been loaded successfully.");
                    }
                } else {
                    alert("Invalid file! Please upload a valid backup file.");
                }
            } catch (err) {
                alert("Failed to read file. This is not a valid backup file.");
            }
        };
        reader.readAsText(file);
    }
</script>
</body>
</html>
