<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        // সিকিউরিটি গার্ড: লগইন করা না থাকলে সরাসরি login.html পেজে পাঠিয়ে দেবে
        if(sessionStorage.getItem('isUnlocked') !== 'true') {
            window.location.href = "login.html";
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garments Data Entry</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --accent-color: #38bdf8;
            --success-gradient: linear-gradient(135deg, #059669 0%, #10b981 100%);
            --bg-color: #f1f5f9;
            --sidebar-bg: #0f172a;
            --sidebar-text: #94a3b8;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --input-bg: #f8fafc;
            --matrix-bg: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            margin: 0; padding: 0;
            display: flex; color: var(--text-color);
        }

        .sidebar {
            width: 260px; background: var(--sidebar-bg); color: var(--sidebar-text);
            height: 100vh; position: fixed; top: 0; left: 0;
            padding: 25px 15px; box-sizing: border-box;
            display: flex; flex-direction: column; gap: 15px;
            box-shadow: 4px 0 15px rgba(0,0,0,0.05);
        }

        .sidebar h3 { margin-top: 0; text-align: center; font-size: 18px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; color: #fff; }
        .sidebar-link { color: #94a3b8; padding: 12px 15px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 10px; transition: all 0.2s; }
        .sidebar-link:hover, .sidebar-link.active { background: rgba(255,255,255,0.05); color: #fff; }
        .sidebar-link.active { border-left: 4px solid var(--accent-color); background: rgba(56, 189, 248, 0.1); }

        .main-content { margin-left: 260px; flex: 1; padding: 20px 30px 40px 30px; box-sizing: border-box; min-height: 100vh; }
        .top-header { display: flex; justify-content: flex-end; align-items: center; padding: 10px 0; margin-bottom: 25px; border-bottom: 1px solid #cbd5e1; }
        .user-profile { display: flex; align-items: center; gap: 12px; padding: 6px 14px; background: #ffffff; border-radius: 30px; border: 1px solid var(--border-color); box-shadow: 0 2px 8px rgba(0,0,0,0.04); cursor: pointer; transition: 0.2s; }
        .user-profile:hover { background: #f8fafc; border-color: #cbd5e1; }
        .profile-avatar { width: 36px; height: 36px; background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); color: white; font-weight: bold; font-size: 16px; display: flex; align-items: center; justify-content: center; border-radius: 50%; box-shadow: 0 2px 6px rgba(2, 132, 199, 0.2); }
        .profile-info { display: flex; flex-direction: column; text-align: left; }
        .profile-name { color: #0f172a; font-weight: 700; font-size: 13px; line-height: 1.2; }
        .profile-role { color: #64748b; font-size: 10px; margin-top: 1px; }

        .container { max-width: 1350px; margin: auto; background: var(--card-bg); padding: 35px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02); border: 1px solid #e2e8f0; }
        h2 { font-size: 26px; font-weight: 800; margin-bottom: 5px; color: #0f172a; }
        .container p { margin-top: 0; margin-bottom: 30px; color: #64748b;}
        .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 6px; font-size: 13px; color: #475569; }
        input, select { padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px; background-color: var(--input-bg); color: var(--text-color); transition: 0.2s; }
        input:focus, select:focus { border-color: var(--accent-color); outline: none; background: #fff;}

        .size-matrix-container { grid-column: span 4; margin-top: 15px; background: var(--matrix-bg); padding: 20px; border: 1px solid var(--border-color); border-radius: 12px; }
        .matrix-table { width: 100%; border-collapse: collapse; background: var(--card-bg); }
        .matrix-table th { background: #1e293b; color: white; padding: 10px; font-size: 13px; }
        .matrix-table td { padding: 10px; border: 1px solid var(--border-color); text-align: center; }
        .matrix-table input[type="number"] { width: 85%; padding: 6px; text-align: center; }
        .btn-container { margin-top: 15px; display: flex; grid-column: span 4; }
        .btn-submit { background: var(--success-gradient); color: white; padding: 12px 25px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: bold; flex: 1; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body>

<div class="sidebar">
    <h3>📊 ERP System</h3>
    <a href="index.html" class="sidebar-link active">📝 Data Entry Form</a>
    <a href="view_data.html" class="sidebar-link">📁 View Entered Data</a>
    
    <a href="#" class="sidebar-link" onclick="logout()" style="margin-top: auto; color: #f87171; background: rgba(248, 113, 113, 0.05);">
        🚪 Log Out
    </a>
</div>

<div class="main-content">
    <div class="top-header">
        <div class="user-profile" title="Arafat's Profile">
            <div class="profile-avatar">A</div>
            <div class="profile-info">
                <span class="profile-name">Arafat</span>
                <span class="profile-role">🟢 Cutting In-charge</span>
            </div>
        </div>
    </div>

    <div class="container">
        <h2>Garments Smart Data Portal</h2>
        <p id="formSubTitle">📝 Cutting Department Data Entry Form</p>
        
        <form id="dataForm" class="form-grid">
            <div class="form-group"><label>Sr. No. / Serial No.</label><input type="text" id="srNo" name="srNo" placeholder="--Select Serial No.--" required autocomplete="off"></div>
            <div class="form-group"><label>Buyer Name</label><input type="text" id="buyerName" name="buyerName" placeholder="--Select Buyer Name--" required autocomplete="off"></div>
            <div class="form-group"><label>Style</label><input type="text" id="style" name="style" placeholder="--Select Style--" required autocomplete="off"></div>
            <div class="form-group"><label>Color</label><input type="text" id="color" name="color" placeholder="--Select Color--" required autocomplete="off"></div>

            <div class="form-group"><label>Date</label><input type="date" id="date" name="date" required></div>
            <div class="form-group"><label>Cutting No.</label><input type="text" id="cuttingNo" name="cuttingNo" placeholder="--Select Cutting No.--" required autocomplete="off"></div>
            <div class="form-group"><label>PO No.</label><input type="text" id="poNo" name="poNo" placeholder="--Select PO No.--" required autocomplete="off"></div>
            <div class="form-group"><label>Batch No.</label><input type="text" id="batchNo" name="batchNo" placeholder="--Select Batch No.--" required autocomplete="off"></div>

            <div class="form-group"><label>Shade</label><input type="text" id="shade" name="shade" placeholder="--Select Shade--" autocomplete="off"></div>
            <div class="form-group"><label>Total Lay</label><input type="number" id="totalLay" name="totalLay" min="0" placeholder="--Select Total Lay--" autocomplete="off"></div>
            <div class="form-group"><label>Table No.</label><input type="text" id="tableNo" name="tableNo" placeholder="--Select Table No.--" autocomplete="off"></div>
            <div class="form-group"><label>M/L (Marker Length)</label><input type="text" id="ml" name="ml" placeholder="--Select Marker Length--" autocomplete="off"></div>

            <div class="form-group"><label>M/W (Marker Width)</label><input type="text" id="mw" name="mw" placeholder="--Select Marker Width--" autocomplete="off"></div>
            <div class="form-group"><label>M/C (Marker Consumption)</label><input type="text" id="mc" name="mc" placeholder="--Select Marker Consumption--" autocomplete="off"></div>
            <div class="form-group"><label>Lay Wet/C</label><input type="text" id="layWetc" name="layWetc" placeholder="--Select Lay Wet/C--" autocomplete="off"></div>
            <div class="form-group"><label>M/EFC</label><input type="text" id="mefc" name="mefc" placeholder="--Select M/EFC--" autocomplete="off"></div>

            <div class="form-group" style="grid-column: span 4;">
                <label>Size Category</label>
                <select id="sizeCategory" name="category" onchange="updateSizeMatrix()">
                    <option value="" disabled selected>--Select Category--</option>
                    <option value="regular">Regular Size (XXS-4XL)</option>
                    <option value="junior">Junior Size (128-176)</option>
                    <option value="ps">PS Size (2XL-8XL)</option>
                </select>
            </div>
            
            <div class="size-matrix-container" id="matrixWrapper" style="display: none;">
                <h4>✏️ Size Setup</h4>
                <div style="overflow-x: auto;">
                    <table class="matrix-table"><thead id="matrixHead"></thead><tbody id="matrixBody"></tbody></table>
                </div>
            </div>
            
            <div class="btn-container">
                <button type="button" id="submitBtn" class="btn-submit" onclick="saveAndGo()">Save & View Data</button>
            </div>
        </form>
    </div>
</div>

<script>
    // আপনার নতুন এবং সচল গুগল অ্যাপস স্ক্রিপ্ট ওয়েব ইউআরএল
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzQWSTqdwlPUHMxOWvnwORTBX8uJa80CCKJT6LKKLOyMoN1K3ynT9A1XWdWCd6AZHXs/exec';

    function logout() {
        if(confirm("Are you sure you want to log out?")) {
            sessionStorage.removeItem('isUnlocked');
            window.location.href = "login.html";
        }
    }

    const sizeGroups = {
        regular: ['XXS', 'XS', 'S', 'M', 'L', 'XL', 'XXL', '3XL', '4XL'],
        junior: ['128', '140', '152', '164', '176'],
        ps: ['2XL', '3XL', '4XL', '5XL', '6XL', '7XL', '8XL']
    };

    let editIndex = null; 

    window.onload = function() {
        const editDataIndex = localStorage.getItem('editIndex');
        const garmentsData = JSON.parse(localStorage.getItem('garmentsData')) || [];

        if(editDataIndex !== null && garmentsData[editDataIndex]) {
            editIndex = parseInt(editDataIndex);
            const data = garmentsData[editIndex];

            document.getElementById('srNo').value = data.srNo || '';
            document.getElementById('buyerName').value = data.buyerName || '';
            document.getElementById('style').value = data.style || '';
            document.getElementById('color').value = data.color || '';
            document.getElementById('date').value = data.date || '';
            document.getElementById('cuttingNo').value = data.cuttingNo || '';
            document.getElementById('poNo').value = data.poNo || '';
            document.getElementById('batchNo').value = data.batchNo || '';
            document.getElementById('shade').value = data.shade || '';
            document.getElementById('totalLay').value = data.totalLay || '';
            document.getElementById('tableNo').value = data.tableNo || '';
            document.getElementById('ml').value = data.ml || '';
            document.getElementById('mw').value = data.mw || '';
            document.getElementById('mc').value = data.mc || '';
            document.getElementById('layWetc').value = data.layWetc || '';
            document.getElementById('mefc').value = data.mefc || '';
            
            document.getElementById('sizeCategory').value = data.category;
            updateSizeMatrix(); 

            const sizes = sizeGroups[data.category];
            sizes.forEach((sz, i) => {
                const sIdx = data.sizesArray.indexOf(sz);
                if(sIdx !== -1) {
                    if(document.getElementById(`ratio_${i}`)) document.getElementById(`ratio_${i}`).value = data.rValues[sIdx];
                    if(document.getElementById(`qty_${i}`)) document.getElementById(`qty_${i}`).value = data.qValues[sIdx];
                }
            });

            document.getElementById('formSubTitle').innerText = "✏️ Update / Edit Garments Data";
            document.getElementById('submitBtn').innerText = "Update & View Data";
            document.getElementById('submitBtn').style.background = "linear-gradient(135deg, #f59e0b 0%, #d97706 100%)";
        }
    }

    function updateSizeMatrix() {
        const category = document.getElementById('sizeCategory').value;
        if (!category) return;
        document.getElementById('matrixWrapper').style.display = "block";
        const sizes = sizeGroups[category];
        
        let headHtml = `<tr><th>Input Type</th>`;
        sizes.forEach(sz => { headHtml += `<th>${sz}</th>`; });
        headHtml += `</tr>`;
        document.getElementById('matrixHead').innerHTML = headHtml;

        let bodyHtml = `<tr><td>Size Ratio</td>`;
        sizes.forEach((sz, i) => { bodyHtml += `<td><input type="number" id="ratio_${i}" min="0" value="0"></td>`; });
        bodyHtml += `</tr><tr><td>Size Qty (Pcs)</td>`;
        sizes.forEach((sz, i) => { bodyHtml += `<td><input type="number" id="qty_${i}" min="0" value="0"></td>`; });
        bodyHtml += `</tr>`;
        document.getElementById('matrixBody').innerHTML = bodyHtml;
    }

    function saveAndGo() {
        const formElement = document.getElementById('dataForm');
        
        if (!formElement.checkValidity()) {
            formElement.reportValidity();
            return;
        }

        const category = document.getElementById('sizeCategory').value;
        if(!category) { alert("Please select a Category!"); return; }

        let ratioValues = [], qtyValues = [], totalRatio = 0, totalQty = 0;
        let sizeDetails = {};

        sizeGroups[category].forEach((sz, i) => {
            const r = parseInt(document.getElementById(`ratio_${i}`).value) || 0;
            const q = parseInt(document.getElementById(`qty_${i}`).value) || 0;
            ratioValues.push(r); qtyValues.push(q);
            totalRatio += r; totalQty += q;
            
            sizeDetails[`ratio_${sz}`] = r;
            sizeDetails[`qty_${sz}`] = q;
        });

        const entryData = {
            srNo: document.getElementById('srNo').value,
            buyerName: document.getElementById('buyerName').value,
            style: document.getElementById('style').value,
            color: document.getElementById('color').value,
            date: document.getElementById('date').value,
            cuttingNo: document.getElementById('cuttingNo').value,
            poNo: document.getElementById('poNo').value,
            batchNo: document.getElementById('batchNo').value,
            shade: document.getElementById('shade').value,
            totalLay: document.getElementById('totalLay').value,
            tableNo: document.getElementById('tableNo').value,
            ml: document.getElementById('ml').value,
            mw: document.getElementById('mw').value,
            mc: document.getElementById('mc').value,
            layWetc: document.getElementById('layWetc').value,
            mefc: document.getElementById('mefc').value,
            category, sizesArray: sizeGroups[category], rValues: ratioValues, qValues: qtyValues, totalRatio, totalQty
        };

        const googleSheetData = { ...entryData, ...sizeDetails };

        const submitBtn = document.getElementById('submitBtn');
        const originalBtnText = submitBtn.innerText;
        submitBtn.disabled = true;
        submitBtn.innerText = "Saving to Google Sheet...";

        // ব্রাউজারের CORS সিকিউরিটি ব্লক এড়ানোর জন্য 'mode: no-cors' কনফিগার করা হলো
        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors', 
            cache: 'no-cache',
            body: JSON.stringify(googleSheetData),
            headers: { 'Content-Type': 'application/json' }
        })
        .then(() => {
            let currentData = JSON.parse(localStorage.getItem('garmentsData')) || [];

            if(editIndex !== null) {
                currentData[editIndex] = entryData;
                localStorage.removeItem('editIndex');
                alert("Data updated successfully in Google Sheet!");
            } else {
                currentData.push(entryData);
                alert("New data saved successfully to Google Sheet!");
            }

            localStorage.setItem('garmentsData', JSON.stringify(currentData));
            window.location.href = "view_data.html";
        })
        .catch(error => {
            console.error('Error!', error.message);
            alert("Failed to save data. Please check your network connection.");
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = originalBtnText;
        });
    }
</script>
</body>
</html>
